# ================= APPLICATION CONFIGURATION ========
spring.application.name=project
server.port=8080

# ================= DATABASE CONFIGURATION ========
spring.datasource.url=jdbc:mysql://localhost:3306/app_project?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

# ================= ERROR HANDLING ========
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
logging.level.org.springframework.web=INFO

# ================= SECURITY LOGGING ========
logging.level.org.springframework.security=INFO

# ================= EMAIL CONFIGURATION ========
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:votre-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:votre-mot-de-passe-application}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App-specific mail settings (used by EmailServiceImpl)
app.mail.from=${MAIL_USERNAME:votre-email@gmail.com}
app.mail.from-name=suiviProject
app.frontend.url=http://localhost:4200

# ================= JWT CONFIGURATION ========
jwt.secret=${JWT_SECRET:change-me-generer-une-cle-base64-de-256-bits-minimum}

# ================= INTERNATIONALIZATION ========
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=true