<div class="login-wrapper">
  <mat-card class="login-card shadow-lg">
    <mat-card-content>

      <div class="text-center brand-section">
        <h1 class="fw-bold">Forgot password?</h1>
        <p class="text-muted">Enter your email and we'll send you a 6-digit OTP to reset it.</p>
      </div>

      <form [formGroup]="form" class="d-grid gap-3" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" />
          <mat-error>
            @if(email?.hasError('required')) { Email is required }
            @if(email?.hasError('email')) { Invalid email address }
          </mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" class="btn-login" type="submit" [disabled]="form.invalid || loading">
          @if (loading) {
            <mat-progress-spinner diameter="20" mode="indeterminate"></mat-progress-spinner>
          } @else {
            <span>Send OTP</span>
          }
        </button>
      </form>

      @if (errorMessage()) {
        <div class="error-alert" role="alert">
          <mat-icon class="me-2">error_outline</mat-icon>
          <div>{{ errorMessage() }}</div>
        </div>
      }

      <div id="link_footer" class="text-center mt-4 small">
        <a class="link" routerLink="/auth/login">Back to login</a>
      </div>
    </mat-card-content>
  </mat-card>
</div>
