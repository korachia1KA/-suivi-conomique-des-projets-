<mat-toolbar class="navbar">
  <div class="navbar-inner">

    <a class="brand" routerLink="/dashboard">
      <span class="brand-mark">
        <span class="brand-mark-inner"></span>
      </span>
      <span class="brand-text">
        <span class="brand-name">SuiviProjet</span>
        <span class="brand-sub">Premium Edition</span>
      </span>
    </a>

    <nav class="nav-links">
      <a mat-button routerLink="/dashboard" routerLinkActive="active">
        <mat-icon>space_dashboard</mat-icon>
        <span>Dashboard</span>
      </a>
      @if (canSeeProjects()) {
        <a mat-button routerLink="/projects" routerLinkActive="active">
          <mat-icon>work_outline</mat-icon>
          <span>Projects</span>
        </a>
      }
      <a mat-button routerLink="/employees" routerLinkActive="active">
        <mat-icon>groups_outlined</mat-icon>
        <span>Employees</span>
      </a>
      <a mat-button routerLink="/costs" routerLinkActive="active">
        <mat-icon>receipt_long</mat-icon>
        <span>Costs</span>
      </a>
      <a mat-button routerLink="/timesheet" routerLinkActive="active">
        <mat-icon>schedule</mat-icon>
        <span>Timesheet</span>
      </a>
      @if (authService.hasRole('ADMIN')) {
        <a mat-button routerLink="/admin/users" routerLinkActive="active">
          <mat-icon>admin_panel_settings</mat-icon>
          <span>Users</span>
        </a>
      }
    </nav>

    <!-- Mobile menu -->
    <mat-menu #mainMenu="matMenu">
      <button mat-menu-item routerLink="/dashboard">
        <mat-icon>space_dashboard</mat-icon>
        <span>Dashboard</span>
      </button>
      @if (canSeeProjects()) {
        <button mat-menu-item routerLink="/projects">
          <mat-icon>work_outline</mat-icon>
          <span>Projects</span>
        </button>
      }
      <button mat-menu-item routerLink="/employees">
        <mat-icon>groups_outlined</mat-icon>
        <span>Employees</span>
      </button>
      <button mat-menu-item routerLink="/costs">
        <mat-icon>receipt_long</mat-icon>
        <span>Costs</span>
      </button>
      <button mat-menu-item routerLink="/timesheet">
        <mat-icon>schedule</mat-icon>
        <span>Timesheet</span>
      </button>
      @if (authService.hasRole('ADMIN')) {
        <button mat-menu-item routerLink="/admin/users">
          <mat-icon>admin_panel_settings</mat-icon>
          <span>Users</span>
        </button>
      }
    </mat-menu>

    <div class="right">
      <button mat-icon-button class="mobile-menu-btn" [matMenuTriggerFor]="mainMenu" aria-label="Menu">
        <mat-icon>menu</mat-icon>
      </button>

      <button
        mat-icon-button
        class="icon-btn"
        [class.icon-btn-highlight]="projectCreatedBellOn()"
        [class.icon-btn-critical]="projectCriticalBellOn()"
        [matMenuTriggerFor]="notificationMenu"
        #notificationMenuTrigger="matMenuTrigger"
        aria-label="Notifications"
      >
        <mat-icon>notifications_none</mat-icon>
        @if (notificationService.unreadCount() > 0) {
          <span class="notif-badge">{{ notificationService.unreadCount() }}</span>
        }
      </button>

      <mat-menu #notificationMenu="matMenu" class="notif-menu" xPosition="before">
        <app-notification-panel (closed)="notificationMenuTrigger.closeMenu()"></app-notification-panel>
      </mat-menu>

      <button mat-button class="user-btn" [matMenuTriggerFor]="userMenu" disableRipple>
        <span class="avatar">{{ userInitial() }}</span>
        <span class="user-meta">
          <span class="user-name">{{ userService.currentUser()?.firstName || 'User' }}</span>
          <span class="user-role">{{ (userService.currentUser()?.roleName || 'MEMBER') | uppercase }}</span>
        </span>
        <mat-icon class="chev">expand_more</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu" class="user-menu">
        <button mat-menu-item routerLink="/user/profile">
          <mat-icon>person_outline</mat-icon>
          <span>Profile</span>
        </button>
        <button mat-menu-item (click)="onLogout()" class="logout-item">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </div>
  </div>
</mat-toolbar>
